name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  strict-rules:
    name: Forbidden keyword scan (no new/delete/malloc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan first-party sources
        run: |
          set -e
          HITS=$(grep -rnwE 'new|delete|malloc|free|calloc|realloc' \
                   server client common tools tests \
                   --include='*.cpp' --include='*.hpp' \
                 | grep -vE '= delete;' \
                 | grep -vE 'freeaddrinfo' || true)
          if [ -n "$HITS" ]; then
            echo "FORBIDDEN MANUAL MEMORY MANAGEMENT FOUND:"
            echo "$HITS"
            exit 1
          fi
          echo "clean: no manual memory management keywords"

  linux:
    name: Linux build + unit + E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: ctest (unit + E2E robustness)
        run: cd build && ctest --output-on-failure

  linux-asan:
    name: AddressSanitizer + LeakSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ASan build
        run: |
          cmake -S . -B build-asan -DENABLE_ASAN=ON
          cmake --build build-asan -j"$(nproc)"
      - name: ctest under sanitizers (leak == test failure)
        run: cd build-asan && ctest --output-on-failure

  windows-cross:
    name: Windows GUI client (zig cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install zig
        run: pip install ziglang
      - name: cross-compile log_client_gui.exe
        run: ./scripts/build_windows_client.sh
      - uses: actions/upload-artifact@v4
        with:
          name: log_client_gui-windows-x64
          path: dist/windows/log_client_gui.exe
